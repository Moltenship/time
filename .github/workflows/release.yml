name: Release

# Manual only: the owner starts it from the Actions tab on main. The first job runs the release
# gate and the dry run; the second publishes the tarballs the dry run checked, with npm provenance.
# After publishing, one job waits for npm to serve the release and checks it against the dry run;
# then one tags the commit with a GitHub release, the only job that can write to the repository,
# and one installs the release from npm into clean apps. Every step is a `vp run` task that also
# runs locally; see docs/internal/releasing.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, such as 1.0.0-rc.1. The package manifests must already have it.
        required: true
        type: string
      tag:
        description: npm dist-tag. Leave empty for next (prereleases) or latest (stable versions).
        required: false
        type: string
      publish:
        description: Publish to npm. Leave it off to rehearse, which runs only the gate and the dry run.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Release gate and dry run
    # An accident guard: a branch's copy of this file can drop it. The npm environment's branch
    # rule is the real limit (docs/internal/releasing.md).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # About 11 minutes on a runner; the browser runs' watchdog catches a stuck page sooner.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "26"
          cache: true

      - name: Install locked dependencies
        run: vp install --frozen-lockfile

      - name: Install Chromium, Firefox and WebKit
        run: vp exec --filter a11y playwright install --with-deps --only-shell chromium firefox webkit

      # The whole full tier: the serial lane, with a strict dry run for this version and the SSR
      # fixture, the docs site and the shadcn install test on its tarballs, then the browser runs.
      # CI's on-demand release-gate job runs these same steps without publishing.
      - name: Release gate and dry run
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: vp run release:gate

      - name: Name the step that failed
        if: failure()
        run: vp run --last-details

      - name: Keep the checked tarballs and manifest
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: verify
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The owner sets this environment's rules: main only, a required reviewer, and the NPM_TOKEN
    # secret or the npm trusted publisher.
    environment: npm
    permissions:
      contents: read
      # npm provenance signs the packages with this job's OIDC token.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "26"
          cache: true

      # No install scripts while this job can mint an OIDC token. Publishing needs none.
      - name: Install locked dependencies
        run: vp install --frozen-lockfile --ignore-scripts

      - name: Get the checked tarballs and manifest
        uses: actions/download-artifact@v8
        with:
          name: release
          path: .release

      - name: Publish
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: vp run release:publish --version "$VERSION" ${TAG:+--tag "$TAG"} --provenance --yes

  published:
    name: Check what npm serves
    needs: publish
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # npm can take minutes to list a new package; release:published waits up to 15.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "26"
          cache: true

      - name: Install locked dependencies
        run: vp install --frozen-lockfile --ignore-scripts

      - name: Get the checked tarballs and manifest
        uses: actions/download-artifact@v8
        with:
          name: release
          path: .release

      - name: Check what npm serves against the dry run
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
        run: vp run release:published --version "$VERSION" ${TAG:+--tag "$TAG"} --provenance

  github:
    name: Tag the commit and write the GitHub release
    needs: published
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The tag and the GitHub release.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "26"
          cache: true

      # No install scripts while this job can write to the repository. The task needs none.
      - name: Install locked dependencies
        run: vp install --frozen-lockfile --ignore-scripts

      - name: Get the checked tarballs and manifest
        uses: actions/download-artifact@v8
        with:
          name: release
          path: .release

      - name: Tag the commit and write the GitHub release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: vp run release:github --version "$VERSION"

  install:
    name: Install the release from npm
    needs: published
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "26"
          cache: true

      - name: Install locked dependencies
        run: vp install --frozen-lockfile

      # #43's install test with the published packages: shadcn init and shadcn add into clean Vite
      # and Next.js apps, from the registry built on this commit, then typecheck and build.
      - name: Install the release into clean apps
        env:
          REGISTRY_E2E_PACKAGES: npm
        run: vp run registry:e2e
