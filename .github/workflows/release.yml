name: Release

# Manual only: the owner starts it from the Actions tab on main. The first job runs the release
# gate and the dry run; the second publishes the tarballs the dry run checked, with npm provenance.
# Every step is a `vp run` task that also runs locally; see docs/internal/releasing.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, such as 1.0.0-rc.1. The package manifests must already have it.
        required: true
        type: string
      tag:
        description: npm dist-tag. Leave empty for next (prereleases) or latest (stable versions).
        required: false
        type: string
      publish:
        description: Publish to npm. Leave it off to rehearse, which runs only the gate and the dry run.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Release gate and dry run
    # An accident guard: a branch's copy of this file can drop it. The npm environment's branch
    # rule is the real limit (docs/internal/releasing.md).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "26"
          cache: true

      - name: Install locked dependencies
        run: vp install --frozen-lockfile

      - name: Install Chromium
        run: vp exec --filter a11y playwright install --with-deps --only-shell chromium

      - name: Release gate
        run: vp run ready

      - name: Dry run
        env:
          VERSION: ${{ inputs.version }}
        run: vp run release:dry-run --version "$VERSION" --require-clean

      - name: shadcn add from the registry, against the checked tarballs
        run: vp run release:registry-e2e

      - name: Keep the checked tarballs and manifest
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: verify
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The owner sets this environment's rules: main only, a required reviewer, and the NPM_TOKEN
    # secret or the npm trusted publisher.
    environment: npm
    permissions:
      contents: read
      # npm provenance signs the packages with this job's OIDC token.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "26"
          cache: true

      # No install scripts while this job can mint an OIDC token. Publishing needs none.
      - name: Install locked dependencies
        run: vp install --frozen-lockfile --ignore-scripts

      - name: Get the checked tarballs and manifest
        uses: actions/download-artifact@v8
        with:
          name: release
          path: .release

      - name: Publish
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: vp run release:publish --version "$VERSION" ${TAG:+--tag "$TAG"} --provenance --yes
