name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Vite+ quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "26"
          cache: true

      - name: Install locked dependencies
        run: vp install --frozen-lockfile

      - name: Checks, builds, tests, React, SSR, registry and package-graph gates
        run: vp run ready:checks

      - name: Name the step that failed
        if: failure()
        run: vp run --last-details

  accessibility:
    name: Accessibility checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "26"
          cache: true

      - name: Install locked dependencies
        run: vp install --frozen-lockfile

      - name: Install Chromium
        run: vp exec --filter a11y playwright install --with-deps --only-shell chromium

      - name: axe-core checks of the registry views and the demo, light and dark
        run: vp run a11y

      - name: Name the step that failed
        if: failure()
        run: vp run --last-details

  browsers:
    name: Firefox and WebKit
    # The full gate's Firefox and WebKit run, on Linux, where Playwright's Firefox starts (#182).
    # On demand, as the full tier runs for releases (AGENTS.md): `gh workflow run ci.yml --ref
    # <branch>`. Pull requests and main run the PR tier. The release-gate job runs it too.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "26"
          cache: true

      - name: Install locked dependencies
        run: vp install --frozen-lockfile

      - name: Install Firefox and WebKit
        run: vp exec --filter a11y playwright install --with-deps firefox webkit

      - name: The a11y suite and interactions in Firefox and WebKit
        run: vp run browsers

      - name: Name the step that failed
        if: failure()
        run: vp run --last-details

  release-gate:
    name: Release gate
    # What the release workflow's verify job runs before it publishes, on a fresh runner, without
    # publishing anything: the whole full tier with a strict dry run. On demand only, as a
    # rehearsal on any branch: `gh workflow run ci.yml --ref <branch>`. Without RELEASE_VERSION,
    # the dry run checks the version the manifests have.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # About 11 minutes on a runner; the browser runs' watchdog catches a stuck page sooner.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "26"
          cache: true

      - name: Install locked dependencies
        run: vp install --frozen-lockfile

      - name: Install Chromium, Firefox and WebKit
        run: vp exec --filter a11y playwright install --with-deps --only-shell chromium firefox webkit

      - name: Release gate and dry run
        run: vp run release:gate

      - name: Name the step that failed
        if: failure()
        run: vp run --last-details
