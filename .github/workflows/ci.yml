name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Vite+ quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "26"
          cache: true

      - name: Install locked dependencies
        run: vp install --frozen-lockfile

      - name: Format, lint, and type checks
        run: vp run ci:check

      - name: Recursive production builds
        run: vp run ci:build

      - name: Root and workspace tests
        run: vp run ci:test

      - name: React isolation, custom-view, and SSR contracts
        run: vp run react:gate

      - name: SSR render, hydrate, interact, and unmount
        run: vp run ssr:smoke

      - name: shadcn registry contract
        run: vp run registry:smoke

      - name: Package dependency graph
        run: vp run package:graph

  accessibility:
    name: Accessibility checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "26"
          cache: true

      - name: Install locked dependencies
        run: vp install --frozen-lockfile

      - name: Install Chromium
        run: vp exec --filter a11y playwright install --with-deps --only-shell chromium

      - name: axe-core checks of the registry views and the demo, light and dark
        run: vp run a11y
