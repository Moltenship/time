<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Calendar · Moltenship Time demo (StyleX)</title>
    <meta
      name="description"
      content="The Moltenship Time demo with its views styled in StyleX: a Google Calendar-style app built on the React calendar for the Temporal API."
    />
    <link rel="canonical" href="https://moltenship-time-demo.vercel.app/stylex/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Moltenship Time" />
    <meta property="og:title" content="Moltenship Time demo (StyleX)" />
    <meta
      property="og:description"
      content="The Moltenship Time demo with its views styled in StyleX."
    />
    <meta property="og:url" content="https://moltenship-time-demo.vercel.app/stylex/" />
    <meta property="og:image" content="https://time.molten.sh/opengraph-image" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme before first paint; with none, the stylesheet follows the system.
      // `.dark` is what the demo's theme hook reads, in both UIs; no style on this page uses it.
      try {
        const saved = localStorage.getItem("moltenship-demo:theme");
        if (saved) document.documentElement.dataset.theme = saved;
        const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/stylex/main.tsx"></script>
  </body>
</html>
