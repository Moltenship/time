<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Calendar · Moltenship Time demo</title>
    <meta
      name="description"
      content="A Google Calendar-style app built with Moltenship Time, the React calendar on the Temporal API: week, day, month, year and agenda views, drag and drop, time zones."
    />
    <link rel="canonical" href="https://moltenship-time-demo.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Moltenship Time" />
    <meta property="og:title" content="Moltenship Time demo" />
    <meta
      property="og:description"
      content="A Google Calendar-style app built with Moltenship Time, the React calendar on the Temporal API."
    />
    <meta property="og:url" content="https://moltenship-time-demo.vercel.app/" />
    <meta property="og:image" content="https://time.molten.sh/opengraph-image" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme, or the system one, before first paint.
      try {
        const saved = localStorage.getItem("moltenship-demo:theme");
        const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
