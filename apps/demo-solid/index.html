<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The React demo's, beside this page on its deployment. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Solid · Moltenship Time demo</title>
    <meta
      name="description"
      content="Moltenship Time's SolidJS 2 integration, a preview, with a month grid and a list of the page's own and an agent panel."
    />
    <link rel="canonical" href="https://moltenship-time-demo.vercel.app/solid/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Moltenship Time" />
    <meta property="og:title" content="Moltenship Time demo (Solid)" />
    <meta
      property="og:description"
      content="Moltenship Time's SolidJS 2 integration, a preview, with an agent panel."
    />
    <meta property="og:url" content="https://moltenship-time-demo.vercel.app/solid/" />
    <meta property="og:image" content="https://time.molten.sh/opengraph-image" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // The theme the React demo saved on this origin (apps/demo/src/theme.ts), before first paint.
      // Without one, the page follows the system's, as `color-scheme: light dark` says.
      try {
        const saved = localStorage.getItem("moltenship-demo:theme");
        if (saved === "light" || saved === "dark")
          document.documentElement.style.colorScheme = saved;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
