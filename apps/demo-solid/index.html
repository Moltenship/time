<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The React demo's, beside this page on its deployment. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Solid · Moltenship Time demo</title>
    <meta
      name="description"
      content="Moltenship Time's SolidJS 2 integration, a preview, with the Solid registry's week, day, month, year, agenda and resource columns, and an agent panel."
    />
    <link rel="canonical" href="https://moltenship-time-demo.vercel.app/solid/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Moltenship Time" />
    <meta property="og:title" content="Moltenship Time demo (Solid)" />
    <meta
      property="og:description"
      content="Moltenship Time's SolidJS 2 integration, a preview, with an agent panel."
    />
    <meta property="og:url" content="https://moltenship-time-demo.vercel.app/solid/" />
    <meta property="og:image" content="https://time.molten.sh/opengraph-image" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // The theme the React demo saved on this origin (apps/demo/src/theme.ts), before first paint.
      // Without one, the page follows the system's, as `color-scheme: light dark` says. The
      // registry's views take their colours from a `.dark` class, as a shadcn app's components do.
      (() => {
        let saved = null;
        try {
          saved = localStorage.getItem("moltenship-demo:theme");
        } catch {}
        const root = document.documentElement;
        if (saved === "light" || saved === "dark") root.style.colorScheme = saved;
        const system = matchMedia("(prefers-color-scheme: dark)");
        const apply = () =>
          root.classList.toggle("dark", saved === "dark" || (saved !== "light" && system.matches));
        apply();
        system.addEventListener("change", apply);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
